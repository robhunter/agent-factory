# agent.yaml — per-agent config read by the agent-portal framework.
# Generated by agent-factory. Identity fields (name/port/cron) are set at
# creation and should not be hand-edited; persona/behavior is captured during
# onboarding into memory/*.yaml.
name: __AGENT_NAME__
repo: "__AGENT_REPO__"
port: __AGENT_PORT__
lock-file: /tmp/__AGENT_NAME__.lock
cron-file: /etc/cron.d/__AGENT_NAME__
cron-schedule: "__CRON_SCHEDULE__"
timezone: __TIMEZONE__
wake-prompt: |
  You are waking up for a scheduled work cycle. Follow the 'On Wake'
  instructions in CLAUDE.md. This is an autonomous cycle — no human is present.
  Work quietly and effectively; write to files, not to chat.
respond-prompt: |
  You received a message from your human. Follow the 'On Wake' instructions
  in CLAUDE.md to recall your state, then respond concisely and stop.
framework-last-known-good: null
